<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b13" />
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong theme. Mirrors the logic in src/lib/theme.ts.
      ;(function () {
        try {
          var pref = localStorage.getItem('bt-theme')
          var dark =
            pref === 'dark' ||
            ((!pref || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0b0b13' : '#f9fafb')
        } catch (e) { /* default to light */ }
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BudgetTracker" />
    <meta name="description" content="Local-first personal finance tracker" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>BudgetTracker</title>
  </head>
  <body class="bg-gray-50 dark:bg-[#0b0b13] text-gray-900 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
